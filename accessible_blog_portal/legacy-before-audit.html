<!DOCTYPE html>
<!--
  BASELINE ("BEFORE") LEGACY WEB PAGE USED FOR ACCESSIBILITY AUDIT
  Purpose: Documents the 14 WebAIM WAVE errors, 19 contrast failures, and 54/100 Lighthouse Accessibility score
  prior to the WCAG 2.2 & WAI-ARIA 1.2 remediation in index.html.
-->
<html> <!-- DEFECT 1: Missing lang="en" attribute (Fails WCAG 3.1.1 Language of Page) -->
<head>
  <meta charset="UTF-8" />
  <title>Blog</title> <!-- DEFECT 2: Non-descriptive page title (Fails WCAG 2.4.2 Page Titled) -->
  <style>
    body {
      font-family: sans-serif;
      background: #ffffff;
      color: #777777; /* DEFECT 3: Low body contrast 4.48:1 (< 4.5:1 AA) */
      margin: 0;
    }
    /* DEFECT 4: Removes visible keyboard focus indicators globally (Fails WCAG 2.4.7 Focus Visible) */
    *:focus {
      outline: none !important;
    }
    .top-bar {
      background: #f5f5f5;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
    }
    .nav-item {
      color: #999999; /* DEFECT 5: Severe low contrast 2.6:1 on #f5f5f5 (Fails WCAG 1.4.3) */
      cursor: pointer;
      margin-right: 12px;
    }
    .main-wrap {
      display: flex;
      max-width: 1000px;
      margin: 20px auto;
      gap: 20px;
    }
    .tab-box span {
      display: inline-block;
      padding: 4px 8px; /* DEFECT 6: Tiny target size < 24x24px (Fails WCAG 2.5.8) */
      background: #eeeeee;
      color: #999999; /* Contrast 2.32:1 */
      cursor: pointer;
    }
    .card {
      border: 1px solid #eeeeee;
      padding: 12px;
      margin-top: 12px;
    }
    .meta {
      color: #aaaaaa; /* Contrast 2.32:1 on #ffffff */
      font-size: 11px;
    }
    .input-box {
      border: 1px solid #e5e7eb; /* DEFECT 7: Non-text contrast 1.2:1 (Fails WCAG 1.4.11) */
      padding: 6px;
    }
  </style>
</head>
<body>
  <!-- DEFECT 8: No Skip Link (Fails WCAG 2.4.1 Bypass Blocks) -->
  <!-- DEFECT 9: "Div Soup" with zero semantic landmarks (<header>, <nav>, <main>, <aside>, <footer> missing) -->
  <div class="top-bar">
    <div class="logo">TechBlog</div>
    <div class="menu">
      <!-- DEFECT 10: Non-keyboard accessible navigation using <span> with onclick -->
      <span class="nav-item" onclick="location.hash='#posts'">Posts</span>
      <span class="nav-item" onclick="location.hash='#faq'">FAQ</span>
    </div>
  </div>

  <div class="main-wrap">
    <div class="left-col">
      <!-- DEFECT 11: Skipped heading hierarchy — jumps straight to <h4> with no <h1>, <h2>, or <h3> -->
      <h4>Welcome to TechBlog</h4>

      <!-- DEFECT 12: Unlabeled search input relying only on placeholder (Fails WCAG 1.3.1 & 3.3.2) -->
      <input type="text" class="input-box" placeholder="Search..." />

      <!-- DEFECT 13: Mouse-only tabs with no role="tablist", role="tab", aria-selected, or keyboard handler -->
      <div class="tab-box">
        <span onclick="alert('All')">All</span>
        <span onclick="alert('HTML')">HTML</span>
        <span onclick="alert('CSS')">CSS</span>
      </div>

      <div class="card">
        <h5>Semantic HTML Guide</h5>
        <div class="meta">Published Nov 2026</div>
        <p>Learn why web structure matters for assistive technology users.</p>
        <!-- DEFECT 14: Ambiguous link text "Click here" (Fails WCAG 2.4.4 Link Purpose) -->
        <a href="https://www.w3.org/TR/WCAG22/">Click here</a>
      </div>
    </div>

    <div class="right-col">
      <h4>Newsletter</h4>
      <!-- DEFECT 15: Inputs without <label>, aria-required, or accessible error messages -->
      <input type="text" class="input-box" placeholder="Name" /><br /><br />
      <input type="text" class="input-box" placeholder="Email" /><br /><br />
      <div onclick="alert('Subscribed')" style="background:#ccc;color:#fff;padding:6px;cursor:pointer;">
        Submit
      </div>
    </div>
  </div>
</body>
</html>
